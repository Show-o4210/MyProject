services:
  - type: web
    name: pvz-h-tools
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/validate_snapshots.py
    startCommand: gunicorn app:app --no-control-socket --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 30 --max-requests 500 --max-requests-jitter 50 --access-logfile - --error-logfile -
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
